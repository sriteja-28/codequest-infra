# Redis configuration for CodeQuest local dev
# Tuned for Channels pub/sub + session cache

# Persistence — RDB snapshot every 5 minutes if ≥1 key changed
save 300 1
save 60 100

# Memory policy: when full, evict least-recently-used keys
maxmemory 256mb
maxmemory-policy allkeys-lru

# Append-only file for extra durability (optional for dev)
appendonly no

# Bind all interfaces in container
bind 0.0.0.0

# Disable protected mode (we're behind Docker network)
protected-mode no

# Log level
loglevel notice

# Databases: 0 = Channels, 1 = cache, 2 = sessions
databases 4